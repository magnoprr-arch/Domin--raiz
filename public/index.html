<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Domino Raiz Online</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #14532d; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    body.vip-theme { background: #1e3a8a; }
    .screen { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 15px; }
    .box { background: #1e293b; padding: 20px; border-radius: 14px; width: 100%; max-width: 380px; border: 1px solid #334155; }
    h2 { margin: 0 0 12px 0; color: #facc15; text-align: center; }
    input, select { width: 100%; padding: 11px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; font-size: 15px; }
    .btn-yellow { background: #eab308; color: #000; }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-whatsapp { background: #25D366; color: #000; }
    .btn-vip { background: #fbbf24; color: #000; }
    #top-bar { background: #0f3d21; padding: 6px 12px; display: flex; justify-content: space-between; font-size: 12px; flex-shrink: 0; }
    #game-area { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 6px; min-height: 0; gap: 6px; }
    .opponents-row { display: flex; justify-content: space-between; gap: 4px; flex-shrink: 0; }
    .player-badge { flex: 1; background: #00000088; padding: 4px 6px; border-radius: 8px; text-align: center; font-size: 11px; border: 2px solid transparent; }
    .player-badge.active { border-color: #facc15; box-shadow: 0 0 8px #facc15; background: #000000cc; }
    #board-box { flex: 1; width: 100%; background: #166534; border-radius: 12px; display: flex; flex-direction: column; align-items: center; padding: 8px; position: relative; overflow-y: auto; border: 2px solid #15803d; min-height: 0; }
    #status { background: #000000bb; padding: 4px 12px; border-radius: 12px; font-size: 12px; color: #fde047; text-align: center; margin-bottom: 8px; flex-shrink: 0; }
    #board { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
    .board-row { display: flex; align-items: center; justify-content: center; gap: 2px; width: 100%; }
    .board-row.reverse { flex-direction: row-reverse; }
    .tile { background: #fdfbf7; border-radius: 5px; border: 2px solid #94a3b8; display: flex; box-shadow: 1px 2px 4px rgba(0,0,0,0.5); user-select: none; flex-shrink: 0; }
    body.vip-theme .tile { background: #fef08a; border-color: #b45309; }
    .tile.h { width: 54px; height: 27px; flex-direction: row; }
    .tile.h.double { width: 27px; height: 42px; flex-direction: column; border-color: #eab308; }
    .tile.h .half:first-child { border-right: 1.5px solid #64748b; }
    .tile.h.double .half:first-child { border-right: none; border-bottom: 1.5px solid #64748b; }
    .tile.hand { width: 42px; height: 82px; flex-direction: column; cursor: pointer; }
    .tile.hand:active { transform: translateY(-6px); border-color: #facc15; }
    .tile.hand .half:first-child { border-bottom: 2px solid #64748b; }
    .half { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 2px; place-items: center; }
    .dot { width: 5.5px; height: 5.5px; background: #0f172a; border-radius: 50%; }
    .tile.h .dot { width: 4px; height: 4px; }
    #hand-area { background: #0f3d21; padding: 8px 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }
    #hand { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; width: 100%; }
    #emoji-toast { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); background: #000000dd; padding: 10px 20px; border-radius: 20px; display: none; z-index: 80; }
    .insta-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 8px; border-radius: 8px; margin-bottom: 6px; }
    .insta-link { background: #e1306c; color: #fff; text-decoration: none; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
  </style>
</head>
  <body>
  <div id="emoji-toast"></div>
  <div id="lobby-screen" class="screen">
    <div class="box">
      <h2>Domino Raiz Online</h2>
      <input type="text" id="player-name" placeholder="Seu Apelido" maxlength="12" />
      <input type="text" id="player-insta" placeholder="Seu @instagram (opcional)" maxlength="25" />
      <div style="display:flex; gap:6px;">
        <input type="text" id="join-code" placeholder="Codigo Sala" style="text-transform:uppercase;" maxlength="4" />
        <button class="btn-blue" style="width:45%;" onclick="joinRoom()">Entrar</button>
      </div>
      <select id="game-mode">
        <option value="pass_pay">Passe Paga + Batida</option>
        <option value="only_win">Apenas Batida</option>
      </select>
      <div style="display:flex; gap:6px;">
        <input type="number" id="pass-cost" value="10" />
        <input type="number" id="start-chips" value="500" />
      </div>
      <button class="btn-yellow" onclick="createRoom()">Criar Sala Privada</button>
      <button class="btn-vip" id="btn-open-vip" onclick="openVipModal()">Seja Dono da Mesa (VIP)</button>
    </div>
  </div>
  <div id="vip-modal" class="screen" style="display:none;">
    <div class="box" style="text-align:center;">
      <h2>Passe VIP</h2>
      <input type="text" id="vip-code-input" placeholder="Chave (Ex: DONO2026)" style="text-transform:uppercase;" />
      <button class="btn-yellow" onclick="activateVip()">Ativar</button>
      <button style="background:#334155; color:#fff;" onclick="document.getElementById('vip-modal').style.display='none'">Voltar</button>
    </div>
  </div>
  <div id="wait-screen" class="screen" style="display:none;">
    <div class="box" style="text-align:center;">
      <h2>Sala: <span id="display-code">----</span></h2>
      <button class="btn-whatsapp" onclick="shareWhatsApp()">Convidar no WhatsApp</button>
      <div id="player-list" style="text-align:left; background:#0f172a; padding:10px; border-radius:8px; margin:10px 0;"></div>
      <button id="btn-start-game" class="btn-green" onclick="startGame()">Iniciar Partida</button>
    </div>
  </div>
  <div id="round-modal" class="screen" style="display:none;">
    <div class="box">
      <h2>Fim da Rodada</h2>
      <p id="round-desc" style="text-align:center; color:#fde047;"></p>
      <div id="round-players"></div>
      <button id="btn-next-round" class="btn-yellow" onclick="startGame()">Proxima Rodada</button>
    </div>
  </div>
  <div id="top-bar"><div>Sala: <strong id="top-code">----</strong> ↺</div><div id="top-rule"></div></div>
  <div id="game-area">
    <div class="opponents-row">
      <div id="seat-left" class="player-badge"></div>
      <div id="seat-top" class="player-badge"></div>
      <div id="seat-right" class="player-badge"></div>
    </div>
    <div id="board-box">
      <div id="status">Aguardando...</div>
      <div id="board"></div>
    </div>
    <div id="hand-area">
      <div style="display:flex; justify-content:space-between; width:100%; align-items:center; gap:8px;">
        <div id="seat-me" class="player-badge" style="flex:none; padding:4px 10px;"></div>
        <button id="btn-pass" style="display:none; background:#dc2626; color:#fff; width:auto; padding:6px 14px; margin:0;" onclick="passTurn()">Passar</button>
      </div>
      <div id="side-btns" style="display:none; gap:8px; width:100%;">
        <button class="btn-blue" style="padding:8px; margin:0;" onclick="confirmSide('left')">⬅ Ponta Esquerda</button>
        <button class="btn-blue" style="padding:8px; margin:0;" onclick="confirmSide('right')">Ponta Direita ➡</button>
      </div>
      <div id="hand"></div>
    </div>
  </div>
      <script>
    const socket = io();
    let currentRoom = '', state = null, selectedIdx = null;
    let isVip = localStorage.getItem('domino_vip') === 'true';
    if (isVip) document.body.classList.add('vip-theme');
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('sala')) document.getElementById('join-code').value = urlParams.get('sala').toUpperCase();

    const PIP_STRINGS = { 0: '', 1: '5', 2: '19', 3: '159', 4: '1379', 5: '13579', 6: '134679' };

    function drawHalf(num) {
      const active = PIP_STRINGS[num] || '';
      let cells = '';
      for (let i = 1; i <= 9; i++) {
        cells += active.includes(String(i)) ? '<span class="dot"></span>' : '<span></span>';
      }
      return '<div class="half">' + cells + '</div>';
    }

    socket.on('toast', m => { const e = document.getElementById('emoji-toast'); e.innerText = m; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 2500); });
    socket.on('errorMsg', m => alert(m));

    function openVipModal() { document.getElementById('vip-modal').style.display = 'flex'; }
    function activateVip() {
      socket.emit('validateVip', document.getElementById('vip-code-input').value, (v) => {
        if (v) { isVip = true; localStorage.setItem('domino_vip', 'true'); document.body.classList.add('vip-theme'); document.getElementById('vip-modal').style.display = 'none'; alert('VIP Ativado!'); }
        else alert('Chave invalida!');
      });
    }
    function createRoom() {
      socket.emit('createRoom', {
        playerName: document.getElementById('player-name').value || 'Anfitriao',
        insta: document.getElementById('player-insta').value,
        isVip: isVip,
        gameMode: document.getElementById('game-mode').value,
        passCost: document.getElementById('pass-cost').value,
        startChips: parseInt(document.getElementById('start-chips').value) || 500
      });
    }
    function joinRoom() {
      const code = document.getElementById('join-code').value;
      if (!code) return alert('Digite o codigo!');
      socket.emit('joinRoom', { roomCode: code, playerName: document.getElementById('player-name').value || 'Jogador', insta: document.getElementById('player-insta').value, isVip: isVip });
    }
    function startGame() { socket.emit('startGame', { roomCode: currentRoom }); }
    function shareWhatsApp() {
      const link = window.location.origin + '/?sala=' + currentRoom;
      window.open('https://wa.me' + encodeURIComponent('Entra na sala ' + currentRoom + ': ' + link), '_blank');
    }

    socket.on('gameState', (s) => {
      state = s; currentRoom = s.roomCode;
      document.getElementById('lobby-screen').style.display = 'none';
      if (!s.started && !s.roundEnded && s.board.length === 0) {
        document.getElementById('wait-screen').style.display = 'flex';
        document.getElementById('display-code').innerText = s.roomCode;
        document.getElementById('player-list').innerHTML = s.players.map((p, i) => '<div>Assento ' + (i + 1) + ': <strong>' + p.name + '</strong></div>').join('');
        document.getElementById('btn-start-game').style.display = s.mySeat === 0 ? 'block' : 'none';
        return;
      }
      document.getElementById('wait-screen').style.display = 'none';
      if (s.roundEnded) {
        document.getElementById('round-modal').style.display = 'flex';
        document.getElementById('round-desc').innerText = s.roundSummary;
        document.getElementById('round-players').innerHTML = s.players.map(p => '<div class="insta-row"><div><strong>' + p.name + '</strong><br><small>Vitorias: ' + p.wins + ' | Fichas: ' + p.chips + '</small></div>' + (p.insta ? '<a class="insta-link" href="https://instagram.com' + p.insta + '" target="_blank">@' + p.insta + '</a>' : '') + '</div>').join('');
        document.getElementById('btn-next-round').style.display = s.mySeat === 0 ? 'block' : 'none';
      } else { document.getElementById('round-modal').style.display = 'none'; }
      renderGame();
    });

    function renderGame() {
      document.getElementById('top-code').innerText = state.roomCode;
      document.getElementById('top-rule').innerText = state.config.gameMode === 'pass_pay' ? 'Passe: ' + state.config.passCost : 'So Batida';
      document.getElementById('status').innerText = state.status;
      const me = state.mySeat;
      updateSeat('seat-me', me, true); updateSeat('seat-right', (me + 1) % 4, false);
      updateSeat('seat-top', (me + 2) % 4, false); updateSeat('seat-left', (me + 3) % 4, false);

      // Organiza o tabuleiro em fileiras zigue-zague de 5 pecas para encaixe perfeito na tela do celular
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      const perRow = 5;
      for (let i = 0; i < state.board.length; i += perRow) {
        const rowDiv = document.createElement('div');
        const rowIndex = Math.floor(i / perRow);
        rowDiv.className = 'board-row' + (rowIndex % 2 === 1 ? ' reverse' : '');
        const slice = state.board.slice(i, i + perRow);
        slice.forEach(t => {
          const isDouble = t.a === t.b;
          const div = document.createElement('div');
          div.className = 'tile h' + (isDouble ? ' double' : '');
          // Inverte visualmente os lados na linha reversa para os pontos encaixarem perfeitamente
          if (rowIndex % 2 === 1 && !isDouble) {
            div.innerHTML = drawHalf(t.b) + drawHalf(t.a);
          } else {
            div.innerHTML = drawHalf(t.a) + drawHalf(t.b);
          }
          rowDiv.appendChild(div);
        });
        boardEl.appendChild(rowDiv);
      }

      const handEl = document.getElementById('hand'); handEl.innerHTML = '';
      state.myHand.forEach((t, idx) => {
        const div = document.createElement('div');
        div.className = 'tile hand'; div.onclick = () => clickTile(idx);
        div.innerHTML = drawHalf(t.a) + drawHalf(t.b);
        handEl.appendChild(div);
      });

      if (state.started && state.currentTurn === me) {
        const canPlay = state.myHand.some(t => {
          if (state.board.length === 0) return true;
          const first = state.board.slice(0, 1).pop(), last = state.board.slice(-1).pop();
          return t.a === first.a || t.b === first.a || t.a === last.b || t.b === last.b;
        });
        document.getElementById('btn-pass').style.display = canPlay ? 'none' : 'block';
      } else {
        document.getElementById('btn-pass').style.display = 'none';
        document.getElementById('side-btns').style.display = 'none';
      }
    }

    function updateSeat(elId, seatIdx, isMe) {
      const p = state.players[seatIdx], el = document.getElementById(elId);
      el.classList.toggle('active', state.started && state.currentTurn === seatIdx);
      el.innerHTML = '<strong>' + (p.isVip ? '👑 ' : '') + p.name + '</strong><br>' + (isMe ? '' : 'Pecas: ' + p.handCount + ' | ') + '🏆' + p.wins + ' | 💰' + p.chips;
    }

    function clickTile(idx) {
      if (!state.started || state.currentTurn !== state.mySeat) return;
      const t = state.myHand[idx];
      if (state.board.length === 0) return socket.emit('playTile', { roomCode: currentRoom, tileIndex: idx, side: 'left' });
      const first = state.board.slice(0, 1).pop(), last = state.board.slice(-1).pop();
      const fitL = t.a === first.a || t.b === first.a, fitR = t.a === last.b || t.b === last.b;
      if (!fitL && !fitR) return;
      if (fitL && fitR && first.a !== last.b) { selectedIdx = idx; document.getElementById('side-btns').style.display = 'flex'; }
      else socket.emit('playTile', { roomCode: currentRoom, tileIndex: idx, side: fitL ? 'left' : 'right' });
    }
    function confirmSide(side) { document.getElementById('side-btns').style.display = 'none'; socket.emit('playTile', { roomCode: currentRoom, tileIndex: selectedIdx, side }); }
    function passTurn() { socket.emit('passTurn', { roomCode: currentRoom }); }
  </script>
</body>
</html>
