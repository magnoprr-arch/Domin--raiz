<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Domino Raiz Online</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #3e2411; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    body.vip-theme { background: #1e293b; }
    .screen { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 15px; overflow-y: auto; }
    .box { background: #29180c; padding: 18px; border-radius: 14px; width: 100%; max-width: 380px; border: 2px solid #854d0e; position: relative; z-index: 55; }
    h2 { margin: 0 0 12px 0; color: #facc15; text-align: center; font-size: 21px; }
    input, select { width: 100%; padding: 10px; margin-bottom: 9px; border-radius: 8px; border: 1px solid #78350f; background: #1c1008; color: #fff; font-size: 14px; }
    button { width: 100%; padding: 11px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; font-size: 14px; }
    .btn-yellow { background: #eab308; color: #000; }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-whatsapp { background: #25D366; color: #000; }
    .btn-vip { background: #fbbf24; color: #000; }
    .btn-donate { background: #0f766e; color: #fff; border: 1px solid #2dd4bf; }
    .pix-box { background: #1c1008; border: 1px dashed #2dd4bf; padding: 12px; border-radius: 10px; margin: 12px 0; word-break: break-all; font-size: 13px; color: #5eead4; }
    .wait-timer-box { background: #1c1008; border: 1px solid #facc15; color: #facc15; padding: 8px; border-radius: 10px; font-weight: bold; font-size: 15px; margin-bottom: 10px; }
    .profile-card { background: #1c1008; border: 1px solid #854d0e; padding: 10px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    #top-bar { background: #29180c; padding: 6px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; flex-shrink: 0; border-bottom: 2px solid #5c3a21; }
    #timer-pill { background: #16a34a; color: #fff; padding: 2px 8px; border-radius: 10px; font-weight: bold; font-size: 12px; }
    #timer-pill.urgent { background: #dc2626; animation: pulse 0.6s infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.12); } }
    #game-area { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 6px; min-height: 0; gap: 6px; }
    #board-box { flex: 1; width: 100%; background: repeating-linear-gradient(90deg, #9c6638 0px, #a87040 14px, #8f5b30 28px, #9c6638 42px); border-radius: 12px; position: relative; overflow: hidden; border: 5px solid #5c3a21; box-shadow: inset 0 0 25px rgba(0,0,0,0.6); min-height: 0; }
    body.vip-theme #board-box { background: #1e3a8a; border-color: #eab308; }
    .player-badge { position: absolute; background: #1c1008e6; padding: 5px 8px; border-radius: 12px; text-align: center; font-size: 10px; border: 2px solid #5c3a21; z-index: 25; line-height: 1.2; min-width: 72px; transition: transform 0.2s; }
    .player-badge.active { border-color: #facc15; box-shadow: 0 0 14px #facc15; background: #29180c; transform: scale(1.06); }
    .avatar-face { font-size: 22px; display: block; margin-bottom: 2px; }
    #seat-top { top: 6px; left: 50%; transform: translateX(-50%); }
    #seat-top.active { transform: translateX(-50%) scale(1.06); }
    #seat-left { top: 50%; left: 6px; transform: translateY(-50%); }
    #seat-left.active { transform: translateY(-50%) scale(1.06); }
    #seat-right { top: 50%; right: 6px; transform: translateY(-50%); }
    #seat-right.active { transform: translateY(-50%) scale(1.06); }
    #seat-me { position: static; flex: none; padding: 4px 10px; font-size: 11px; display: flex; align-items: center; gap: 6px; text-align: left; }
    #status { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); width: fit-content; max-width: 85%; background: #1c1008ee; padding: 3px 10px; border-radius: 12px; font-size: 11px; color: #fde047; z-index: 20; border: 1px solid #854d0e; text-align: center; }
    #board-canvas { position: relative; width: 100%; height: 100%; }
    .tile { background: linear-gradient(145deg, #ffffff, #f1ece1); border-radius: 6px; border: 1.5px solid #cbd5e1; display: flex; box-shadow: 2px 4px 6px rgba(0,0,0,0.55); user-select: none; position: relative; }
    .tile::after { content: ''; position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: radial-gradient(circle, #fef08a, #ca8a04); border-radius: 50%; transform: translate(-50%, -50%); z-index: 3; }
    .tile.board-tile { position: absolute; }
    .tile.horiz { flex-direction: row; }
    .tile.horiz .half:first-child { border-right: 2px solid #1e293b; }
    .tile.vert { flex-direction: column; }
    .tile.vert .half:first-child { border-bottom: 2px solid #1e293b; }
    .tile.hand { width: 46px; height: 90px; flex-direction: column; cursor: pointer; flex-shrink: 0; }
    .tile.hand:active { transform: translateY(-6px); border-color: #facc15; }
    .tile.hand .half:first-child { border-bottom: 2px solid #1e293b; }
    .half { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 3px; place-items: center; }
    .dot { width: 6px; height: 6px; background: #0f172a; border-radius: 50%; }
    .board-tile .dot { width: 5px; height: 5px; }
    #hand-area { background: #29180c; padding: 8px 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; border-top: 2px solid #5c3a21; }
    #hand { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; width: 100%; }
    #emoji-toast { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); background: #000000dd; padding: 10px 20px; border-radius: 20px; display: none; z-index: 80; }
    .insta-row { display: flex; justify-content: space-between; align-items: center; background: #1c1008; padding: 8px; border-radius: 8px; margin-bottom: 6px; }
    .insta-link { background: #e1306c; color: #fff; text-decoration: none; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
    .end-banner { text-align: center; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
    .end-win { background: linear-gradient(45deg, #ca8a04, #eab308); color: #000; font-weight: bold; }
    .end-lose { background: #334155; color: #f8fafc; font-weight: bold; }
    .confetti { position: fixed; width: 10px; height: 10px; top: -10px; z-index: 60; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }
  </style>
</head>
<body>
  <div id="emoji-toast"></div>
  <div id="lobby-screen" class="screen">
    <div class="box">
      <h2>Domino Raiz Online</h2>
      <div id="saved-account-bar" class="profile-card" style="display:none;">
        <div>
          <strong id="acc-name" style="color:#facc15;"></strong><br>
          <small id="acc-stats" style="color:#cbd5e1;"></small>
        </div>
        <button style="width:auto; padding:6px 10px; margin:0; background:#334155; color:#fff; font-size:12px;" onclick="editAccount()">Editar</button>
      </div>
      <div id="account-inputs">
        <input type="text" id="player-name" placeholder="Criar Conta: Seu Apelido" maxlength="12" />
        <input type="text" id="player-insta" placeholder="Seu @instagram (opcional)" maxlength="25" />
      </div>
      <div style="display:flex; gap:6px;">
        <input type="text" id="join-code" placeholder="Codigo Sala" style="text-transform:uppercase;" maxlength="4" />
        <button class="btn-blue" style="width:45%;" onclick="joinRoom()">Entrar</button>
      </div>
      <select id="game-mode">
        <option value="pass_pay">Passe Paga + Batida</option>
        <option value="only_win">Apenas Batida</option>
      </select>
      <div style="display:flex; gap:6px;">
        <input type="number" id="pass-cost" value="10" />
        <input type="number" id="start-chips" value="500" />
      </div>
      <button class="btn-yellow" onclick="createRoom()">Criar Sala (1m20s p/ Amigos)</button>
      <div style="display:flex; gap:6px;">
        <button class="btn-vip" id="btn-open-vip" style="margin-bottom:0;" onclick="openVipModal()">👑 Seja VIP</button>
        <button class="btn-donate" style="margin-bottom:0;" onclick="openDonateModal()">☕ Apoiar (Pix)</button>
      </div>
    </div>
  </div>

  <div id="donate-modal" class="screen" style="display:none;">
    <div class="box" style="text-align:center;">
      <h2>☕ Apoie o Criador</h2>
      <p style="font-size:13px; color:#cbd5e1; margin-top:0;">Curtiu o Domino Raiz? Qualquer valor via Pix ajuda a manter o servidor online!</p>
      <div class="pix-box">
        <div style="font-size:11px; color:#94a3b8; margin-bottom:4px;">CHAVE PIX:</div>
        <strong id="pix-key-text">SUA-CHAVE-PIX-AQUI</strong>
      </div>
      <button class="btn-green" onclick="copyPixKey()">📋 Copiar Chave Pix</button>
      <button style="background:#334155; color:#fff;" onclick="document.getElementById('donate-modal').style.display='none'">Voltar ao Jogo</button>
    </div>
  </div>

  <div id="vip-modal" class="screen" style="display:none;">
    <div class="box" style="text-align:center;">
      <h2>Passe VIP</h2>
      <input type="text" id="vip-code-input" placeholder="Chave (Ex: DONO2026)" style="text-transform:uppercase;" />
      <button class="btn-yellow" onclick="activateVip()">Ativar</button>
      <button style="background:#334155; color:#fff;" onclick="document.getElementById('vip-modal').style.display='none'">Voltar</button>
    </div>
  </div>

  <div id="wait-screen" class="screen" style="display:none;">
    <div class="box" style="text-align:center;">
      <h2>Sala: <span id="display-code">----</span></h2>
      <div id="wait-timer-display" class="wait-timer-box">⏳ Bots entram em: 01:20</div>
      <button class="btn-whatsapp" onclick="shareWhatsApp()">📲 Convidar Amigos no WhatsApp</button>
      <button style="background:#334155; color:#fff; font-size:13px;" onclick="copyRoomLink()">📋 Copiar Link da Sala</button>
      <div id="player-list" style="text-align:left; background:#1c1008; padding:10px; border-radius:8px; margin:10px 0; font-size:13px;"></div>
      <button id="btn-start-game" class="btn-green" onclick="startGame()">Iniciar Agora (Completar c/ Bots)</button>
    </div>
  </div>

  <div id="round-modal" class="screen" style="display:none;">
    <div class="box">
      <div id="end-banner" class="end-banner"></div>
      <p id="round-desc" style="text-align:center; color:#fde047; font-size:14px;"></p>
      <div id="round-players"></div>
      <button id="btn-next-round" class="btn-yellow" style="margin-top:8px;" onclick="startGame()">Proxima Rodada</button>
      <button class="btn-donate" style="padding:8px; font-size:13px;" onclick="openDonateModal()">☕ Fazer uma Doacao (Pix)</button>
    </div>
  </div>

  <div id="top-bar">
    <div>Sala: <strong id="top-code">----</strong> ↺</div>
    <div id="timer-pill">⏱ 10s</div>
    <div id="top-rule"></div>
  </div>
  <div id="game-area">
    <div id="board-box">
      <div id="seat-top" class="player-badge"></div>
      <div id="seat-left" class="player-badge"></div>
      <div id="seat-right" class="player-badge"></div>
      <div id="status">Aguardando...</div>
      <div id="board-canvas"></div>
    </div>
    <div id="hand-area">
      <div style="display:flex; justify-content:space-between; width:100%; align-items:center; gap:8px;">
        <div id="seat-me" class="player-badge"></div>
        <button id="btn-pass" style="display:none; background:#dc2626; color:#fff; width:auto; padding:6px 14px; margin:0;" onclick="passTurn()">Passar</button>
      </div>
      <div id="side-btns" style="display:none; gap:8px; width:100%;">
        <button class="btn-blue" style="padding:8px; margin:0;" onclick="confirmSide('left')">⬆ Ponta de Cima</button>
        <button class="btn-blue" style="padding:8px; margin:0;" onclick="confirmSide('right')">Ponta de Baixo ⬇</button>
      </div>
      <div id="hand"></div>
    </div>
  </div>
    <script>
    const socket = io();
    let currentRoom = '', state = null, selectedIdx = null;
    let isVip = localStorage.getItem('domino_vip') === 'true';
    if (isVip) document.body.classList.add('vip-theme');

    let userProfile = JSON.parse(localStorage.getItem('domino_profile') || 'null');
    function loadSavedAccount() {
      if (userProfile && userProfile.name) {
        document.getElementById('player-name').value = userProfile.name;
        document.getElementById('player-insta').value = userProfile.insta || '';
        document.getElementById('saved-account-bar').style.display = 'flex';
        document.getElementById('account-inputs').style.display = 'none';
        document.getElementById('acc-name').innerText = '😎 ' + userProfile.name + (userProfile.insta ? ' (@' + userProfile.insta + ')' : '');
        document.getElementById('acc-stats').innerText = '🏆 Vitorias: ' + (userProfile.wins || 0) + ' | 💰 Banco: ' + (userProfile.chips || 500);
        document.getElementById('start-chips').value = userProfile.chips || 500;
      }
    }
    function editAccount() {
      document.getElementById('saved-account-bar').style.display = 'none';
      document.getElementById('account-inputs').style.display = 'block';
    }
    function saveAccount() {
      const name = (document.getElementById('player-name').value || '').trim() || 'Jogador';
      const insta = (document.getElementById('player-insta').value || '').replace('@', '').trim();
      userProfile = {
        name: name,
        insta: insta,
        wins: userProfile ? (userProfile.wins || 0) : 0,
        chips: userProfile ? (userProfile.chips || 500) : (parseInt(document.getElementById('start-chips').value) || 500)
      };
      localStorage.setItem('domino_profile', JSON.stringify(userProfile));
    }
    loadSavedAccount();

    function openDonateModal() { document.getElementById('donate-modal').style.display = 'flex'; }
    function copyPixKey() {
      const pix = document.getElementById('pix-key-text').innerText;
      navigator.clipboard.writeText(pix).then(() => alert('Chave Pix copiada! Agora e so colar no app do seu banco.'));
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('sala')) document.getElementById('join-code').value = urlParams.get('sala').toUpperCase();

    const AVATARS = ['😎', '🧔', '🤠', '👵'];
    const PIPS_VERT = { 0: '', 1: '5', 2: '19', 3: '159', 4: '1379', 5: '13579', 6: '134679' };
    const PIPS_HORIZ = { 0: '', 1: '5', 2: '37', 3: '357', 4: '1379', 5: '13579', 6: '123789' };

    setInterval(() => {
      // Relogio da Sala de Espera (1m 20s)
      const waitBox = document.getElementById('wait-timer-display');
      if (state && !state.started && state.waitDeadline && waitBox) {
        const rem = Math.max(0, Math.ceil((state.waitDeadline - Date.now()) / 1000));
        const mins = String(Math.floor(rem / 60)).padStart(2, '0');
        const secs = String(rem % 60).padStart(2, '0');
        waitBox.innerText = '⏳ Bots entram em: ' + mins + ':' + secs;
      }

      // Relogio da Jogada (10s)
      const pill = document.getElementById('timer-pill');
      if (!state || !state.started || !state.turnDeadline) {
        pill.innerText = '⏱ --';
        pill.classList.remove('urgent');
        return;
      }
      const left = Math.max(0, Math.ceil((state.turnDeadline - Date.now()) / 1000));
      pill.innerText = '⏱ ' + left + 's';
      pill.classList.toggle('urgent', left <= 3);
    }, 250);

    function drawHalf(n, isHoriz) {
      let c = '', a = (isHoriz ? PIPS_HORIZ[n] : PIPS_VERT[n]) || '';
      for (let i = 1; i <= 9; i++) c += a.includes(String(i)) ? '<span class="dot"></span>' : '<span></span>';
      return '<div class="half">' + c + '</div>';
    }

    function playSoundEffect(type) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        const ctx = new AC();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (type === 'tile') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(45, ctx.currentTime + 0.09);
          gain.gain.setValueAtTime(0.6, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.09);
          osc.start(); osc.stop(ctx.currentTime + 0.09);
        } else if (type === 'pass') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(240, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(140, ctx.currentTime + 0.22);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          osc.start(); osc.stop(ctx.currentTime + 0.22);
        } else if (type === 'win') {
          osc.type = 'triangle'; osc.frequency.setValueAtTime(523, ctx.currentTime);
          osc.frequency.setValueAtTime(659, ctx.currentTime + 0.12);
          osc.frequency.setValueAtTime(784, ctx.currentTime + 0.24);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          osc.start(); osc.stop(ctx.currentTime + 0.45);
        }
      } catch(e) {}
    }

    function launchConfetti() {
      const colors = ['#facc15', '#22c55e', '#3b82f6', '#ef4444', '#a855f7'];
      for (let i = 0; i < 35; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = colors[i % colors.length];
        c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3500);
      }
    }

    socket.on('playSound', t => playSoundEffect(t));
    socket.on('toast', m => { const e = document.getElementById('emoji-toast'); e.innerText = m; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 2500); });
    socket.on('errorMsg', m => alert(m));

    function openVipModal() { document.getElementById('vip-modal').style.display = 'flex'; }
    function activateVip() {
      socket.emit('validateVip', document.getElementById('vip-code-input').value, v => {
        if (v) { isVip = true; localStorage.setItem('domino_vip', 'true'); document.body.classList.add('vip-theme'); document.getElementById('vip-modal').style.display = 'none'; alert('VIP Ativado!'); }
        else alert('Chave invalida!');
      });
    }
    function createRoom() {
      saveAccount();
      playSoundEffect('tile');
      socket.emit('createRoom', {
        playerName: userProfile.name,
        insta: userProfile.insta,
        isVip, gameMode: document.getElementById('game-mode').value,
        passCost: document.getElementById('pass-cost').value,
        startChips: parseInt(document.getElementById('start-chips').value) || 500
      });
    }
    function joinRoom() {
      const code = document.getElementById('join-code').value;
      if (!code) return alert('Digite o codigo!');
      saveAccount();
      playSoundEffect('tile');
      socket.emit('joinRoom', { roomCode: code, playerName: userProfile.name, insta: userProfile.insta, isVip });
    }
    function startGame() { socket.emit('startGame', { roomCode: currentRoom }); }

    function shareWhatsApp() {
      const link = window.location.origin + '/?sala=' + currentRoom;
      const msg = 'Vem jogar Domino Raiz comigo! Entra direto na Sala ' + currentRoom + ': ' + link;
      window.location.href = 'https://whatsapp.com' + encodeURIComponent(msg);
    }
    function copyRoomLink() {
      const link = window.location.origin + '/?sala=' + currentRoom;
      navigator.clipboard.writeText(link).then(() => alert('Link copiado! Cole no WhatsApp dos amigos.'));
    }
          socket.on('gameState', s => {
      state = s; currentRoom = s.roomCode;
      document.getElementById('lobby-screen').style.display = 'none';
      if (!s.started && !s.roundEnded && s.board.length === 0) {
        document.getElementById('wait-screen').style.display = 'flex';
        document.getElementById('display-code').innerText = s.roomCode;
        document.getElementById('player-list').innerHTML = s.players.map((p, i) => '<div style="margin-bottom:4px;">' + (p.isEmpty ? '⏳' : AVATARS[i]) + ' Assento ' + (i + 1) + ': <strong>' + p.name + '</strong></div>').join('');
        document.getElementById('btn-start-game').style.display = s.mySeat === 0 ? 'block' : 'none';
        return;
      }
      document.getElementById('wait-screen').style.display = 'none';
      if (s.roundEnded) {
        document.getElementById('round-modal').style.display = 'flex';
        const meObj = s.players[s.mySeat];
        if (userProfile) {
          userProfile.chips = meObj.chips;
          userProfile.wins = meObj.wins;
          localStorage.setItem('domino_profile', JSON.stringify(userProfile));
        }
        const iWon = s.roundSummary.includes(meObj.name);
        const banner = document.getElementById('end-banner');
        if (iWon) {
          banner.className = 'end-banner end-win';
          banner.innerHTML = '🏆 PARABENS, ' + meObj.name.toUpperCase() + '!<br><small>Voce venceu a rodada!</small>';
          launchConfetti();
        } else {
          banner.className = 'end-banner end-lose';
          banner.innerHTML = '😅 MAIS SORTE NA PROXIMA!<br><small>Nao foi dessa vez, tente na proxima!</small>';
        }
        document.getElementById('round-desc').innerText = s.roundSummary;
        document.getElementById('round-players').innerHTML = s.players.map((p, i) => '<div class="insta-row"><div>' + AVATARS[i] + ' <strong>' + p.name + '</strong><br><small>Vitorias: ' + p.wins + ' | Fichas: ' + p.chips + '</small></div>' + (p.insta ? '<a class="insta-link" href="https://instagram.com' + p.insta + '" target="_blank">@' + p.insta + '</a>' : '') + '</div>').join('');
        document.getElementById('btn-next-round').style.display = s.mySeat === 0 ? 'block' : 'none';
      } else document.getElementById('round-modal').style.display = 'none';
      renderGame();
    });

    function renderVerticalBoard() {
      const canvas = document.getElementById('board-canvas');
      canvas.innerHTML = '';
      if (!state.board || !state.board.length) return;

      const box = document.getElementById('board-box');
      const boxW = box.clientWidth;
      const boxH = box.clientHeight;

      const scale = state.board.length > 18 ? 0.72 : (state.board.length > 12 ? 0.85 : 1.0);
      const L = Math.floor(62 * scale);
      const S = Math.floor(31 * scale);
      const gap = 2;

      const centerIdx = state.centerIndex || 0;
      const centerTile = state.board[centerIdx];
      const cDbl = centerTile.a === centerTile.b;
      const cw = cDbl ? L : S;
      const ch = cDbl ? S : L;

      const startX = Math.floor(boxW / 2);
      const startY = Math.floor(boxH / 2) + 22;

      const cEl = document.createElement('div');
      cEl.className = 'tile board-tile ' + (cDbl ? 'horiz' : 'vert');
      cEl.style.cssText = 'width:' + cw + 'px;height:' + ch + 'px;left:' + (startX - Math.floor(cw / 2)) + 'px;top:' + (startY - Math.floor(ch / 2)) + 'px;';
      cEl.innerHTML = drawHalf(centerTile.a, cDbl) + drawHalf(centerTile.b, cDbl);
      canvas.appendChild(cEl);

      let bx = startX, by = startY + Math.floor(ch / 2) + gap, bDir = 'down';
      for (let i = centerIdx + 1; i < state.board.length; i++) {
        const t = state.board[i], dbl = t.a === t.b;
        let w, h, ori, v1, v2, x, y;
        if (bDir === 'down') {
          w = dbl ? L : S; h = dbl ? S : L; ori = dbl ? 'horiz' : 'vert';
          v1 = t.a; v2 = t.b; x = bx - Math.floor(w / 2); y = by;
          by += h + gap;
          if (by + L > boxH - 12 && i < state.board.length - 1) bDir = 'right';
        } else if (bDir === 'right') {
          w = L; h = S; ori = 'horiz'; v1 = t.a; v2 = t.b;
          x = bx - Math.floor(S / 2); y = by; bx = x + w + gap;
          if (bx + L > boxW - 84 && i < state.board.length - 1) {
            bDir = 'up'; bx = x + w - Math.floor(S / 2); by = y - gap;
          }
        } else if (bDir === 'up') {
          w = dbl ? L : S; h = dbl ? S : L; ori = dbl ? 'horiz' : 'vert';
          v1 = t.b; v2 = t.a; by -= h; x = bx - Math.floor(w / 2); y = by;
          by -= gap;
          if (by - L < 92 && i < state.board.length - 1) {
            bDir = 'leftTop'; bx = x - gap;
          }
        } else {
          w = L; h = S; ori = 'horiz'; v1 = t.b; v2 = t.a;
          x = bx - w; y = by; bx = x - gap;
        }
        const el = document.createElement('div');
        el.className = 'tile board-tile ' + ori;
        el.style.cssText = 'width:' + w + 'px;height:' + h + 'px;left:' + x + 'px;top:' + y + 'px;';
        el.innerHTML = drawHalf(v1, ori === 'horiz') + drawHalf(v2, ori === 'horiz');
        canvas.appendChild(el);
      }

      let tx = startX, ty = startY - Math.floor(ch / 2) - gap, tDir = 'up';
      for (let i = centerIdx - 1; i >= 0; i--) {
        const t = state.board[i], dbl = t.a === t.b;
        let w, h, ori, v1, v2, x, y;
        if (tDir === 'up') {
          w = dbl ? L : S; h = dbl ? S : L; ori = dbl ? 'horiz' : 'vert';
          v1 = t.a; v2 = t.b; ty -= h; x = tx - Math.floor(w / 2); y = ty;
          ty -= gap;
          if (ty - L < 92 && i > 0) tDir = 'left';
        } else if (tDir === 'left') {
          w = L; h = S; ori = 'horiz'; v1 = t.a; v2 = t.b;
          x = tx + Math.floor(S / 2) - w; y = ty - S; tx = x - gap;
          if (tx - L < 84 && i > 0) {
            tDir = 'down'; tx = x + Math.floor(S / 2); ty = y + S + gap;
          }
        } else {
          w = dbl ? L : S; h = dbl ? S : L; ori = dbl ? 'horiz' : 'vert';
          v1 = t.b; v2 = t.a; x = tx - Math.floor(w / 2); y = ty;
          ty += h + gap;
        }
        const el = document.createElement('div');
        el.className = 'tile board-tile ' + ori;
        el.style.cssText = 'width:' + w + 'px;height:' + h + 'px;left:' + x + 'px;top:' + y + 'px;';
        el.innerHTML = drawHalf(v1, ori === 'horiz') + drawHalf(v2, ori === 'horiz');
        canvas.appendChild(el);
      }
    }

    function renderGame() {
      document.getElementById('top-code').innerText = state.roomCode;
      document.getElementById('top-rule').innerText = state.config.gameMode === 'pass_pay' ? 'Passe: ' + state.config.passCost : 'So Batida';
      document.getElementById('status').innerText = state.status;
      const me = state.mySeat;
      updateSeat('seat-me', me, true);
      updateSeat('seat-right', (me + 1) % 4, false);
      updateSeat('seat-top', (me + 2) % 4, false);
      updateSeat('seat-left', (me + 3) % 4, false);
      renderVerticalBoard();

      const handEl = document.getElementById('hand'); handEl.innerHTML = '';
      state.myHand.forEach((t, idx) => {
        const div = document.createElement('div');
        div.className = 'tile hand'; div.onclick = () => clickTile(idx);
        div.innerHTML = drawHalf(t.a, false) + drawHalf(t.b, false);
        handEl.appendChild(div);
      });

      if (state.started && state.currentTurn === me) {
        const canPlay = state.myHand.some(t => {
          if (!state.board.length) return true;
          const f = state.board.slice(0, 1).pop(), l = state.board.slice(-1).pop();
          return t.a === f.a || t.b === f.a || t.a === l.b || t.b === l.b;
        });
        document.getElementById('btn-pass').style.display = canPlay ? 'none' : 'block';
      } else {
        document.getElementById('btn-pass').style.display = 'none';
        document.getElementById('side-btns').style.display = 'none';
      }
    }

    function updateSeat(id, idx, me) {
      const p = state.players[idx], el = document.getElementById(id);
      el.classList.toggle('active', state.started && state.currentTurn === idx);
      const face = '<span class="avatar-face">' + AVATARS[idx % 4] + '</span>';
      if (me) {
        el.innerHTML = face + '<div><strong>' + (p.isVip ? '👑 ' : '') + p.name + '</strong><br>🏆' + p.wins + ' 💰' + p.chips + '</div>';
      } else {
        el.innerHTML = face + '<strong>' + (p.isVip ? '👑 ' : '') + p.name + '</strong><br>🁣 ' + p.handCount + ' | 🏆' + p.wins;
      }
    }

    function clickTile(idx) {
      if (!state.started || state.currentTurn !== state.mySeat) return;
      const t = state.myHand[idx];
      if (!state.board.length) return socket.emit('playTile', { roomCode: currentRoom, tileIndex: idx, side: 'left' });
      const f = state.board.slice(0, 1).pop(), l = state.board.slice(-1).pop();
      const fitL = t.a === f.a || t.b === f.a, fitR = t.a === l.b || t.b === l.b;
      if (!fitL && !fitR) return;
      if (fitL && fitR && f.a !== l.b) { selectedIdx = idx; document.getElementById('side-btns').style.display = 'flex'; }
      else socket.emit('playTile', { roomCode: currentRoom, tileIndex: idx, side: fitL ? 'left' : 'right' });
    }
    function confirmSide(side) { document.getElementById('side-btns').style.display = 'none'; socket.emit('playTile', { roomCode: currentRoom, tileIndex: selectedIdx, side }); }
    function passTurn() { socket.emit('passTurn', { roomCode: currentRoom }); }
  </script>
