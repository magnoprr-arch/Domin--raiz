<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Domino Raiz Online</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { margin: 0; background: #14532d; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    body.vip-theme { background: #1e3a8a; }
    .screen { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 15px; }
    .box { background: #1e293b; padding: 20px; border-radius: 14px; width: 100%; max-width: 380px; border: 1px solid #334155; }
    h2 { margin: 0 0 12px 0; color: #facc15; text-align: center; }
    input, select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
    .btn-yellow { background: #eab308; color: #000; }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-whatsapp { background: #25D366; color: #000; }
    .btn-vip { background: #fbbf24; color: #000; }
    #top-bar { background: #0f3d21; padding: 8px 12px; display: flex; justify-content: space-between; font-size: 12px; }
    #game-area { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; }
    .player-badge { background: #00000077; padding: 5px 8px; border-radius: 8px; text-align: center; font-size: 11px; border: 2px solid transparent; }
    .player-badge.active { border-color: #facc15; }
    .mid-row { display: flex; justify-content: space-between; align-items: center; flex: 1; margin: 6px 0; gap: 6px; }
    #board-box { flex: 1; height: 100%; background: #166534; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; position: relative; overflow-y: auto; }
    #status { position: absolute; top: 6px; background: #000000aa; padding: 4px 10px; border-radius: 12px; font-size: 12px; color: #fde047; }
    #board { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; margin-top: 28px; }
    .tile { background: #f8fafc; color: #0f172a; border-radius: 4px; border: 2px solid #94a3b8; display: flex; font-weight: bold; }
    .tile.h { width: 44px; height: 22px; }
    .tile.h.double { width: 22px; height: 44px; flex-direction: column; }
    .tile .half { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; border: 1px solid #cbd5e1; }
    #hand-area { background: #0f3d21; padding: 8px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    #hand { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
    .tile.hand { width: 36px; height: 70px; flex-direction: column; cursor: pointer; }
    #emoji-toast { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); background: #000000dd; padding: 10px 20px; border-radius: 20px; display: none; z-index: 80; }
    .insta-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 8px; border-radius: 8px; margin-bottom: 6px; }
    .insta-link { background: #e1306c; color: #fff; text-decoration: none; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
  </style>
</head>
  <body>
  <div id="emoji-toast"></div>
  <div id="lobby-screen" class="screen">
    <div class="box">
      <h2>Domino Raiz Online</h2>
      <input type="text" id="player-name" placeholder="Seu Apelido" maxlength="12" />
      <input type="text" id="player-insta" placeholder="Seu @instagram (opcional)" maxlength="25" />
      <div style="display:flex; gap:6px;">
        <input type="text" id="join-code" placeholder="Codigo Sala" style="text-transform:uppercase;" maxlength="4" />
        <button class="btn-blue" style="width:45%;" onclick="joinRoom()">Entrar</button>
      </div>
      <select id="game-mode">
        <option value="pass_pay">Passe Paga + Batida</option>
        <option value="only_win">Apenas Batida</option>
      </select>
      <div style="display:flex; gap:6px;">
        <input type="number" id="pass-cost" value="10" />
        <input type="number" id="start-chips" value="500" />
      </div>
      <button class="btn-yellow" onclick="createRoom()">Criar Sala Privada</button>
      <button class="btn-vip" id="btn-open-vip" onclick="openVipModal()">Seja Dono da Mesa (VIP)</button>
    </div>
  </div>
  <div id="vip-modal" class="screen" style="display:none;">
    <div class="box" style="text-align:center;">
      <h2>Passe VIP</h2>
      <input type="text" id="vip-code-input" placeholder="Chave (Ex: DONO2026)" style="text-transform:uppercase;" />
      <button class="btn-yellow" onclick="activateVip()">Ativar</button>
      <button style="background:#334155; color:#fff;" onclick="document.getElementById('vip-modal').style.display='none'">Voltar</button>
    </div>
  </div>
  <div id="wait-screen" class="screen" style="display:none;">
    <div class="box" style="text-align:center;">
      <h2>Sala: <span id="display-code">----</span></h2>
      <button class="btn-whatsapp" onclick="shareWhatsApp()">Convidar no WhatsApp</button>
      <div id="player-list" style="text-align:left; background:#0f172a; padding:10px; border-radius:8px; margin:10px 0;"></div>
      <button id="btn-start-game" class="btn-green" onclick="startGame()">Iniciar Partida</button>
    </div>
  </div>
  <div id="round-modal" class="screen" style="display:none;">
    <div class="box">
      <h2>Fim da Rodada</h2>
      <p id="round-desc" style="text-align:center; color:#fde047;"></p>
      <div id="round-players"></div>
      <button id="btn-next-round" class="btn-yellow" onclick="startGame()">Proxima Rodada</button>
    </div>
  </div>
  <div id="top-bar"><div>Sala: <strong id="top-code">----</strong></div><div id="top-rule"></div></div>
  <div id="game-area">
    <div id="seat-top" class="player-badge" style="align-self:center;"></div>
    <div class="mid-row">
      <div id="seat-left" class="player-badge"></div>
      <div id="board-box"><div id="status">Aguardando...</div><div id="board"></div></div>
      <div id="seat-right" class="player-badge"></div>
    </div>
    <div id="hand-area">
      <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
        <div id="seat-me" class="player-badge"></div>
        <button id="btn-pass" style="display:none; background:#dc2626; color:#fff; width:auto; padding:6px 12px; margin:0;" onclick="passTurn()">Passar</button>
      </div>
      <div id="side-btns" style="display:none; gap:8px; width:100%;">
        <button class="btn-blue" onclick="confirmSide('left')">Esquerda</button>
        <button class="btn-blue" onclick="confirmSide('right')">Direita</button>
      </div>
      <div id="hand"></div>
    </div>
  </div>
