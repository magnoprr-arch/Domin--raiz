<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Domino Raiz Online</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { margin: 0; background: #14532d; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    body.vip-theme { background: #1e3a8a; }
    .screen { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 15px; }
    .box { background: #1e293b; padding: 20px; border-radius: 14px; width: 100%; max-width: 380px; border: 1px solid #334155; }
    h2 { margin: 0 0 12px 0; color: #facc15; text-align: center; }
    input, select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
    .btn-yellow { background: #eab308; color: #000; }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-whatsapp { background: #25D366; color: #000; }
    .btn-vip { background: #fbbf24; color: #000; }
    #top-bar { background: #0f3d21; padding: 8px 12px; display: flex; justify-content: space-between; font-size: 12px; }
    #game-area { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; }
    .player-badge { background: #00000077; padding: 5px 8px; border-radius: 8px; text-align: center; font-size: 11px; border: 2px solid transparent; }
    .player-badge.active { border-color: #facc15; }
    .mid-row { display: flex; justify-content: space-between; align-items: center; flex: 1; margin: 6px 0; gap: 6px; }
    #board-box { flex: 1; height: 100%; background: #166534; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; position: relative; overflow-y: auto; }
    #status { position: absolute; top: 6px; background: #000000aa; padding: 4px 10px; border-radius: 12px; font-size: 12px; color: #fde047; }
    #board { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; margin-top: 28px; }
    .tile { background: #f8fafc; color: #0f172a; border-radius: 4px; border: 2px solid #94a3b8; display: flex; font-weight: bold; }
    .tile.h { width: 44px; height: 22px; }
    .tile.h.double { width: 22px; height: 44px; flex-direction: column; }
    .tile .half { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; border: 1px solid #cbd5e1; }
    #hand-area { background: #0f3d21; padding: 8px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    #hand { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
    .tile.hand { width: 36px; height: 70px; flex-direction: column; cursor: pointer; }
    #emoji-toast { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); background: #000000dd; padding: 10px 20px; border-radius: 20px; display: none; z-index: 80; }
    .insta-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 8px; border-radius: 8px; margin-bottom: 6px; }
    .insta-link { background: #e1306c; color: #fff; text-decoration: none; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
  </style>
</head>
